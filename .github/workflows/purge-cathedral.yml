name: Purge Abandoned_Cathedral from history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES in capital letters to confirm (this is irreversible)'
        required: true

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "Confirmation not given (YES was not typed). Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install git-filter-repo
        run: pip install --user git-filter-repo

      - name: Purge Content/Abandoned_Cathedral from all history
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git filter-repo --force --invert-paths --path Content/Abandoned_Cathedral

      - name: Re-add origin and force-push cleaned history
        run: |
          git remote add origin https://github.com/${{ github.repository }}.git
          git push --force origin --all
          git push --force origin --tags
